version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: kahoot_mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kahoot}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-kahoot}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - kahoot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kahoot_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
      - "9000:9000"
    environment:
      APP_NAME: ${APP_NAME:-Kahoot}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:3000}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-localhost}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kahoot}
      DB_USERNAME: ${DB_USERNAME:-kahoot}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: database
      QUEUE_CONNECTION: redis
    volumes:
      - ./backend-api:/app
      - app_storage:/app/storage
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kahoot-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kahoot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kahoot-network

  # Vue.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kahoot_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./front-end:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - app
    networks:
      - kahoot-network

volumes:
  dbdata:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local

networks:
  kahoot-network:
    driver: bridge
